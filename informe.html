<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Informe de Diagnóstico · Áurea Facility Services — Dharma Brokers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{ --gold-10:rgba(255,215,0,.10); --gold-20:rgba(255,215,0,.20); --gold-30:rgba(255,215,0,.30);
         --paper:#121111; --paper-2:#0d0d0d; --ink:#e9e6df; --ink-dim:#a8a39a; --ok:#22c55e; --warn:#FFA500; --crit:#ef4444; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#070707;color:#fff;font-family:'Poppins',system-ui,sans-serif;overflow:hidden;}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(1100px 700px at 50% -10%, rgba(255,215,0,.07), transparent 60%), #070707;}
  .topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;
    padding:0 1.2rem;z-index:50;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);}
  .topbar .brand{display:inline-flex;align-items:center;gap:.55rem;}
  .topbar .brand img{width:24px;}
  .topbar .brand b{font-family:'Oswald';font-weight:800;letter-spacing:1.3px;font-size:.85rem;
    background:linear-gradient(135deg,var(--gold),var(--gold-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .topbar a.back{color:var(--ink-dim);font-size:.78rem;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;}
  .topbar a.back:hover{color:var(--gold);}

  /* book */
  .book-wrap{perspective:2600px;}
  .book{position:relative;height:min(82vh,860px);width:min(92vw, calc(82vh * 0.73));
    border-radius:6px 12px 12px 6px;box-shadow:-18px 24px 70px rgba(0,0,0,.7);}
  .page,.leaf{position:absolute;inset:0;border-radius:6px 12px 12px 6px;overflow:hidden;}
  .page{background:linear-gradient(115deg,var(--paper) 0%, var(--paper-2) 100%);}
  .page::before{content:'';position:absolute;top:0;bottom:0;left:0;width:34px;
    background:linear-gradient(90deg, rgba(0,0,0,.5), transparent);pointer-events:none;z-index:5;}
  .leaf{transform-origin:left center;transform-style:preserve-3d;transition:transform .66s cubic-bezier(.6,.02,.2,1);z-index:20;display:none;}
  .leaf .face{position:absolute;inset:0;border-radius:6px 12px 12px 6px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:linear-gradient(115deg,var(--paper) 0%, var(--paper-2) 100%);}
  .leaf .face.back{transform:rotateY(180deg);}
  .leaf .face::before{content:'';position:absolute;top:0;bottom:0;left:0;width:34px;background:linear-gradient(90deg, rgba(0,0,0,.5), transparent);z-index:5;}
  .leaf.flipping .face.front::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,rgba(0,0,0,.32));z-index:6;}

  .pg{position:absolute;inset:0;overflow-y:auto;padding:clamp(1.6rem,3.4vw,2.8rem) clamp(1.6rem,3.4vw,2.6rem) clamp(2.4rem,4vw,3rem) clamp(2.4rem,4vw,3.2rem);}
  .pg::-webkit-scrollbar{width:5px;} .pg::-webkit-scrollbar-thumb{background:var(--gold-30);border-radius:3px;}
  .pnum{position:absolute;bottom:.9rem;right:1.4rem;font-family:'Oswald';font-size:.66rem;letter-spacing:1.5px;color:var(--ink-dim);}
  .ph{font-family:'Oswald';font-size:.64rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem;}
  .pg h2{font-family:'Oswald';font-weight:800;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.1;margin:.1rem 0 1rem;color:#fff;}
  .pg h2 em{font-style:italic;color:var(--gold);}
  .pg h3{font-family:'Oswald';font-weight:700;font-size:1.05rem;color:var(--gold);margin:1.3rem 0 .5rem;}
  .pg p{font-size:clamp(.86rem,1.55vw,.96rem);line-height:1.75;color:var(--ink);margin:0 0 .85rem;}
  .pg p b{color:#fff;} .pg .dim{color:var(--ink-dim);} .pg .gold{color:var(--gold);}
  .pg .lead{font-size:clamp(1rem,1.9vw,1.15rem);line-height:1.7;color:#fff;font-weight:500;}
  .pg .rule{height:1px;background:linear-gradient(90deg,var(--gold-30),transparent);margin:1.1rem 0;}
  .pg ul{list-style:none;margin:.2rem 0 1rem;padding:0;}
  .pg ul li{position:relative;padding-left:1.3rem;margin-bottom:.5rem;font-size:.88rem;line-height:1.55;color:var(--ink);}
  .pg ul li::before{content:'';position:absolute;left:.2rem;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold);}

  /* visual bits inside pages */
  .statband{display:flex;gap:.7rem;margin:1rem 0;flex-wrap:wrap;}
  .sb{flex:1;min-width:88px;background:rgba(255,255,255,.03);border:1px solid var(--gold-20);border-radius:11px;padding:.7rem .8rem;}
  .sb .v{font-family:'Oswald';font-weight:800;font-size:1.5rem;line-height:1;}
  .sb .l{font-size:.64rem;color:var(--ink-dim);margin-top:.25rem;letter-spacing:.4px;text-transform:uppercase;}
  .scbar{margin:.5rem 0;}
  .scbar .row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:.7rem;margin-bottom:.5rem;}
  .scbar .row .n{font-size:.78rem;color:var(--ink-dim);}
  .scbar .row .t{height:20px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden;}
  .scbar .row .t>i{display:block;height:100%;border-radius:6px;}
  .scbar .row .e{font-family:'Oswald';font-weight:700;font-size:.92rem;color:#fff;}
  .quotebox{border-left:3px solid var(--gold);background:rgba(255,215,0,.05);border-radius:0 10px 10px 0;padding:.9rem 1.1rem;margin:1rem 0;font-style:italic;color:#fff;font-size:.92rem;line-height:1.55;}
  .coi{display:inline-block;background:rgba(239,68,68,.13);color:#ff8585;border-radius:7px;padding:.25rem .6rem;font-family:'Oswald';font-weight:700;font-size:.8rem;letter-spacing:.5px;}
  .kv{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.07);padding:.45rem 0;font-size:.85rem;}
  .kv span:first-child{color:var(--ink-dim);} .kv span:last-child{color:#fff;font-family:'Oswald';font-weight:600;}
  .areagrid .ar{display:grid;grid-template-columns:42px 1fr;gap:.7rem;align-items:center;padding:.55rem 0;border-top:1px solid rgba(255,255,255,.07);}
  .areagrid .ar .as{font-family:'Oswald';font-weight:800;font-size:1.2rem;text-align:center;}
  .areagrid .ar b{font-size:.92rem;color:#fff;} .areagrid .ar p{margin:.1rem 0 0;font-size:.76rem;color:var(--ink-dim);line-height:1.4;}

  /* cover */
  .cover{display:flex;flex-direction:column;height:100%;justify-content:space-between;
    background:radial-gradient(700px 500px at 70% 10%, rgba(255,215,0,.10), transparent 55%), linear-gradient(160deg,#161310,#0a0908);}
  .cover .ct{padding:clamp(2rem,4vw,3rem);}
  .cover img.logo{width:56px;margin-bottom:1.5rem;}
  .cover .conf{font-family:'Oswald';font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--crit);border:1px solid rgba(239,68,68,.35);border-radius:50px;padding:.3rem .8rem;display:inline-block;}
  .cover h1{font-family:'Oswald';font-weight:800;font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:1.6rem 0 .6rem;
    background:linear-gradient(135deg,#fff 0%,var(--gold) 70%,var(--gold-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .cover .sub{color:var(--ink-dim);font-size:1rem;line-height:1.6;max-width:90%;}
  .cover .foot{padding:clamp(2rem,4vw,3rem);border-top:1px solid var(--gold-20);}
  .cover .foot .co{font-family:'Oswald';font-weight:700;font-size:1.5rem;color:#fff;}
  .cover .foot .meta{color:var(--ink-dim);font-size:.82rem;margin-top:.3rem;}

  c-c{color:var(--crit);} 

  /* chrome / controls */
  .controls{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:center;gap:1rem;z-index:50;
    background:linear-gradient(0deg,rgba(0,0,0,.6),transparent);}
  .nbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold-30);background:rgba(20,20,20,.8);color:var(--gold);cursor:pointer;display:grid;place-items:center;transition:all .15s;}
  .nbtn:hover{background:var(--gold-10);} .nbtn:disabled{opacity:.3;cursor:default;}
  .nbtn svg{width:20px;height:20px;}
  .pind{font-family:'Oswald';font-size:.8rem;letter-spacing:1px;color:var(--ink-dim);min-width:70px;text-align:center;}
  .pind b{color:#fff;}
  .idxbtn{position:absolute;left:1.2rem;background:transparent;border:1px solid var(--gold-30);color:var(--ink-dim);border-radius:50px;padding:.4rem .9rem;font-family:'Poppins';font-size:.76rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;}
  .idxbtn:hover{color:var(--gold);border-color:var(--gold);}
  .edge{position:absolute;top:0;bottom:0;width:22%;z-index:18;cursor:pointer;}
  .edge.l{left:0;} .edge.r{right:0;}

  /* index drawer */
  .drawer{position:fixed;inset:0;z-index:60;background:rgba(7,7,7,.9);backdrop-filter:blur(8px);display:none;padding:3.5rem 1.5rem;overflow-y:auto;}
  .drawer.open{display:block;}
  .drawer-in{max-width:560px;margin:0 auto;}
  .drawer h3{font-family:'Oswald';font-weight:800;font-size:1.4rem;color:#fff;margin:0 0 1.2rem;}
  .drawer .it{display:flex;align-items:center;gap:.9rem;padding:.75rem .9rem;border-radius:10px;cursor:pointer;border:1px solid transparent;}
  .drawer .it:hover{background:var(--gold-10);border-color:var(--gold-30);}
  .drawer .it .ix{font-family:'Oswald';font-weight:700;color:var(--gold);width:28px;}
  .drawer .it .ti{color:#eee;font-size:.94rem;}
  .drawer .close{position:absolute;top:1.2rem;right:1.4rem;background:transparent;border:none;color:var(--ink-dim);font-size:1.8rem;cursor:pointer;line-height:1;}
  .progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));z-index:55;transition:width .3s;}

  @media (max-width:560px){
    .book{height:min(80vh,720px);width:94vw;}
    .topbar .brand b{display:none;}
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<div class="stage">

      <div class="page"><div id="bookFront"></div></div>

        <div class="face front"></div>

      <div class="edge r" id="edgeR"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="idxbtn" id="idxBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Índice</button>

<script>
/* ---- helpers para bloques visuales ---- */
function scbar(rows){ // rows: [name, pct, value, color]
  return '<div class="scbar">' + rows.map(function(r){
    return '<div class="row"><span class="n">'+r[0]+'</span><span class="t"><i style="width:'+r[1]+'%;background:'+r[3]+'"></i></span><span class="e">'+r[2]+'</span></div>';
  }).join('') + '</div>';
}

/* ============================== PÁGINAS ============================== */
var PAGES = [
{ title:'Portada', html:
  '<div class="cover">'+
   '<div class="ct"><img class="logo" src="assets/logo-compass-white.png" alt="">'+
     '<span class="conf">Confidencial · solo destinatario</span>'+
     '<h1>Informe de Diagnóstico Estratégico</h1>'+
     '<div class="sub">Análisis financiero, operativo y de valoración · Fase 1</div>'+
   '</div>'+
   '<div class="foot"><div class="co">Áurea Facility Services</div>'+
     '<div class="meta">Servicios profesionales · Madrid · Preparado por Dharma Brokers Consulting · Junio 2026</div></div>'+
  '</div>' },

{ title:'Índice y cómo leerlo', html:
  '<div class="pg"><div class="ph">Orientación</div><h2>Cómo leer <em>este informe</em>.</h2>'+
  '<p>Este documento es un diagnóstico priorizado, no exhaustivo. En 5 días hemos identificado el 80 % de los factores que más afectan al valor de su empresa y a su autonomía operativa. No encontrará relleno: cada afirmación tiene un número detrás.</p>'+
  '<div class="rule"></div>'+
  '<h3>Recorrido</h3>'+
  '<ul>'+
   '<li><b>Resumen ejecutivo</b> — la tesis en una página.</li>'+
   '<li><b>La empresa y su mercado</b> — contexto.</li>'+
   '<li><b>Valoración</b> — tres escenarios y su metodología.</li>'+
   '<li><b>Dependencia del fundador</b> — la cifra que descuentan los compradores.</li>'+
   '<li><b>Los 3 bloqueos críticos</b> — con coste de inacción.</li>'+
   '<li><b>Diagnóstico por área</b> y <b>hoja de ruta de 90 días</b>.</li>'+
   '<li><b>Pre-auditoría</b> y siguiente paso.</li>'+
  '</ul>'+
  '<div class="quotebox">Lo que sigue está pensado para que pueda tomar una decisión — crecer, vender o captar capital — con criterio, no con intuición.</div>'+
  '</div>' },

{ title:'Resumen ejecutivo', html:
  '<div class="pg"><div class="ph">01 · Resumen ejecutivo</div><h2>Negocio rentable y con marca, pero <em>atado a su fundador</em>.</h2>'+
  '<p class="lead">Áurea es un activo sano con cimientos vendibles — y, hoy, una extensión de su dueño.</p>'+
  '<p>Con 9 años de trayectoria, <b>1,6 M€</b> de facturación y un EBITDA normalizado del <b>15 %</b>, Áurea cuenta con contratos recurrentes, una tasa de renovación superior al 85 % y reputación en su nicho. Su foso defensivo es la confianza de clientes de larga duración.</p>'+
  '<p>El problema no es comercial, es estructural: el negocio depende del fundador en sus tres engranajes críticos — cierra él las ventas relevantes, valida él la operativa y centraliza él la cuenta que aporta el <b>28 %</b> de la facturación. Un comprador descuenta esa dependencia con fuerza.</p>'+
  '<div class="statband">'+
    '<div class="sb"><div class="v" style="color:#ff6b6b">3,2<span style="font-size:.7rem">/10</span></div><div class="l">Autonomía</div></div>'+
    '<div class="sb"><div class="v" style="color:var(--warn)">41</div><div class="l">Prep. venta</div></div>'+
    '<div class="sb"><div class="v" style="color:var(--warn)">54</div><div class="l">Salud operativa</div></div>'+
  '</div>'+
  '<p>La oportunidad: la empresa está dejando entre un <b class="gold">25 % y 30 %</b> de su valoración sobre la mesa. Capturarla no exige vender más, sino transformar conocimiento tácito en activo transferible.</p>'+
  '</div>' },

{ title:'La empresa y su mercado', html:
  '<div class="pg"><div class="ph">02 · Contexto</div><h2>La empresa y <em>su mercado</em>.</h2>'+
  '<p>Áurea opera en mantenimiento integral (facility management) para clientes corporativos en el área de Madrid: limpieza técnica, pequeñas reformas, mantenimiento preventivo y correctivo. Es un mercado fragmentado, de relación y recurrencia, donde la confianza pesa más que el precio — y donde la consolidación por compra es habitual.</p>'+
  '<h3>Lo que la hace valiosa</h3>'+
  '<ul><li>Ingresos recurrentes con renovación &gt; 85 %.</li>'+
   '<li>Reputación y red de contactos del fundador en el tejido empresarial local.</li>'+
   '<li>Equipo operativo competente y estable.</li></ul>'+
  '<h3>Lo que un comprador mira primero</h3>'+
  '<ul><li>¿Sobrevive la cartera sin el fundador?</li>'+
   '<li>¿Está el conocimiento documentado o en cabezas?</li>'+
   '<li>¿Son los números verificables?</li></ul>'+
  '<p class="dim">Las tres respuestas, hoy, juegan en contra del precio. Las tres son corregibles en 90 días.</p>'+
  '</div>' },

{ title:'Valoración', html:
  '<div class="pg"><div class="ph">03 · Valoración</div><h2>Cuánto vale <em>hoy</em> — y cuánto podría valer.</h2>'+
  '<p>Aplicando múltiplos de EBITDA del sector servicios (<b>5,0× base</b>) sobre un EBITDA normalizado de <b>240 k€</b>, ajustado por geografía, ciclo de mercado, tamaño, crecimiento, antigüedad, recurrencia y dependencia del fundador:</p>'+
  scbar([['Mínimo viable',55,'520 K€','linear-gradient(90deg,#ef4444,#f87171)'],
         ['Realista (hoy)',78,'737 K€','linear-gradient(90deg,#FFD700,#FFA500)'],
         ['Objetivo',100,'945 K€','linear-gradient(90deg,#FFA500,#22c55e)']])+
  '<div class="kv"><span>Fórmula</span><span style="font-size:.78rem">EBITDA × Múltiplo × Ajustes × Dependencia</span></div>'+
  '<div class="kv"><span>EBITDA normalizado</span><span>240 K€</span></div>'+
  '<div class="kv"><span>Múltiplo efectivo (realista)</span><span>3,07×</span></div>'+
  '<p style="margin-top:1rem">La palanca que separa el escenario realista del objetivo es la <b>dependencia del fundador</b>. Reducirla de alta a baja añade <b class="gold">≈208 K€</b> de valor — sin tocar la facturación. El resto de palancas (geografía, ciclo, tamaño…) ajustan el múltiplo base de mercado.</p>'+
  '<p class="dim" style="font-size:.78rem">Rango orientativo. Una valoración formal requiere due diligence y comparables transaccionales recientes.</p>'+
  '</div>' },

{ title:'Dependencia del fundador', html:
  '<div class="pg"><div class="ph">04 · Dependencia</div><h2>Dónde se va el tiempo <em>del dueño</em>.</h2>'+
  '<p>El fundador dedica <b>31 horas semanales</b> a la operativa, con un índice de dependencia de <b style="color:#ff6b6b">7,5/10</b>. La concentración es máxima donde más duele para una venta: Ventas y Delivery.</p>'+
  scbar([['Ventas',100,'12 h','linear-gradient(90deg,#ef4444,#f87171)'],
         ['Delivery',67,'8 h','linear-gradient(90deg,#ef4444,#f87171)'],
         ['Administración',50,'6 h','linear-gradient(90deg,#FFA500,#FFD700)'],
         ['Marketing',25,'3 h','linear-gradient(90deg,#38bdf8,#7dd3fc)'],
         ['Seguridad',17,'2 h','linear-gradient(90deg,#FFA500,#FFD700)']])+
  '<h3>Relaciones críticas no documentadas</h3>'+
  '<ul><li>Cliente principal (28 % de la facturación): relación exclusiva del fundador, sin permanencia.</li>'+
   '<li>Proveedor clave: acuerdo de precio verbal, sin formalizar.</li>'+
   '<li>Línea de crédito (120 k€): avalada a título personal del fundador.</li></ul>'+
  '<div class="quotebox">Todo lo que se va con el fundador si él se va. Es lo primero que un comprador exige blindar.</div>'+
  '</div>' },

{ title:'Bloqueo 1 · Concentración de cliente', html:
  '<div class="pg"><div class="ph">05 · Bloqueo crítico #1</div><h2>Concentración <em>de cliente</em>.</h2>'+
  '<span class="coi">COI: 38 K€ / trimestre</span>'+
  '<p style="margin-top:1rem">Un solo cliente concentra el <b>28 %</b> de la facturación (≈448 k€/año) y su relación depende en exclusiva del fundador, sin contrato de permanencia. Si ese cliente se va — o se va con el fundador tras la operación — el negocio pierde más de un cuarto de sus ingresos de golpe. No reduce el valor por rentabilidad, sino por <b>riesgo de ingresos</b>: el múltiplo aplicable cae.</p>'+
  '<h3>Evidencia</h3>'+
  '<ul><li>El segundo mayor cliente no llega a 95 k€/año.</li>'+
   '<li>No existe contrato de permanencia ni penalización por salida.</li>'+
   '<li>El interlocutor único es el fundador; el equipo no tiene relación directa.</li></ul>'+
  '<div class="quotebox">Recomendación: contrato a 24 meses y un segundo interlocutor del equipo en la cuenta, antes de cualquier proceso de venta.</div>'+
  '</div>' },

{ title:'Bloqueo 2 · Operativa sin documentar', html:
  '<div class="pg"><div class="ph">05 · Bloqueo crítico #2</div><h2>Operativa <em>sin documentar</em>.</h2>'+
  '<span class="coi">COI: 30 K€ / trimestre</span>'+
  '<p style="margin-top:1rem">El proceso de entrega funciona bien, pero vive en la cabeza del fundador y de dos responsables veteranos. No hay procedimientos escritos ni formación reglada. Esto pone un techo a la escala — no se crece sin clonar al dueño — y es un riesgo que el due diligence saca a la luz: la calidad la garantizan personas, no un sistema.</p>'+
  '<h3>Evidencia</h3>'+

/* ============================== MOTOR DEL LIBRO ============================== */
var KEY='dharma_book_pg';
var cur = (function(){ var n=parseInt(localStorage.getItem(KEY),10); return (isFinite(n)&&n>=0&&n<PAGES.length)?n:0; })();
var busy=false;
var bookFront=document.getElementById('bookFront');
var leaf=document.getElementById('leaf');
var faceFront=leaf.querySelector('.front'), faceBack=leaf.querySelector('.back');
var pind=document.getElementById('pind'), progress=document.getElementById('progress');
var prevB=document.getElementById('prev'), nextB=document.getElementById('next');

function chrome(){
  pind.innerHTML='<b>'+(cur+1)+'</b> / '+PAGES.length;
  progress.style.width=((cur)/(PAGES.length-1)*100)+'%';
  prevB.disabled=(cur===0); nextB.disabled=(cur===PAGES.length-1);
  localStorage.setItem(KEY,cur);
}
function showStatic(){ bookFront.innerHTML=PAGES[cur].html; chrome(); }

function go(dir){
  var dest=cur+dir;
  if(busy||dest<0||dest>=PAGES.length) return;
  busy=true;
  bookFront.innerHTML=PAGES[dest].html; // destino debajo
  leaf.style.transition='none';
  if(dir>0){ faceFront.innerHTML=PAGES[cur].html; faceBack.innerHTML=PAGES[dest].html; leaf.style.transform='rotateY(0deg)'; }
  else      { faceFront.innerHTML=PAGES[dest].html; faceBack.innerHTML=PAGES[cur].html; leaf.style.transform='rotateY(-180deg)'; }
  leaf.style.display='block'; leaf.classList.add('flipping');
  // force reflow then animate
  void leaf.offsetWidth;
  leaf.style.transition='transform .66s cubic-bezier(.6,.02,.2,1)';
  leaf.style.transform= dir>0 ? 'rotateY(-180deg)' : 'rotateY(0deg)';
  var done=function(){
    leaf.removeEventListener('transitionend',done);
    leaf.style.display='none'; leaf.classList.remove('flipping');
    cur=dest; chrome(); busy=false;
  };
  leaf.addEventListener('transitionend',done);
  // safety timeout
  setTimeout(function(){ if(busy){ done(); } },800);
}

function goTo(i){ if(i===cur)return; cur=i; showStatic(); }

prevB.onclick=function(){go(-1);};
nextB.onclick=function(){go(1);};
document.getElementById('edgeR').onclick=function(){go(1);};
document.getElementById('edgeL').onclick=function(){go(-1);};
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1); else if(e.key==='Escape')closeDrawer(); });

/* swipe */
var tx=null;
document.querySelector('.book').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.querySelector('.book').addEventListener('touchend',function(e){ if(tx===null)return; var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>45){ go(dx<0?1:-1);} tx=null;},{passive:true});

/* index drawer */
var drawer=document.getElementById('drawer'), list=document.getElementById('drawerList');
PAGES.forEach(function(p,i){
  var d=document.createElement('div'); d.className='it';
  d.innerHTML='<span class="ix">'+(i+1)+'</span><span class="ti">'+p.title+'</span>';
  d.onclick=function(){ goTo(i); closeDrawer(); };
  list.appendChild(d);
});
function openDrawer(){drawer.classList.add('open');}
function closeDrawer(){drawer.classList.remove('open');}
document.getElementById('idxBtn').onclick=openDrawer;
document.getElementById('drawerClose').onclick=closeDrawer;
drawer.addEventListener('click',function(e){ if(e.target===drawer) closeDrawer(); });

showStatic();
</script>
